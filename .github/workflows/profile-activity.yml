name: Refresh profile activity

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-activity
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out profile
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check activity generator
        run: python3 -m unittest discover -s tests -v
      - name: Generate activity from public metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/update_activity.py
      - name: Commit changed card
        run: |
          if git diff --quiet -- assets/activity.svg; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/activity.svg
          git commit -m "chore: refresh public project activity"
          git push
