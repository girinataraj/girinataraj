<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc"><style>
@keyframes trace{to{stroke-dashoffset:-1200}}
@keyframes breathe{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes fillbar{0%,8%{transform:scaleX(.15)}55%,92%{transform:scaleX(1)}100%{transform:scaleX(.15)}}
.moving-rule{stroke-dasharray:180 1020;animation:trace 7s linear infinite}
.activity-dot{animation:breathe 3s ease-in-out infinite}
.telemetry-bar{transform-box:fill-box;transform-origin:left;animation:fillbar 8s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.moving-rule,.activity-dot,.telemetry-bar{animation:none}}
</style>
<title id="title">From the workshop: latest public project pushes</title>
<desc id="desc">Public, original, non-archived repositories. Dates are last code pushes in UTC. Checked 2026-10-30.</desc>
<rect width="1200" height="380" rx="20" fill="#0b1624"/>
<g font-family="Consolas, Liberation Mono, monospace">
<text x="42" y="49" fill="#6ee6ec" font-size="17" letter-spacing="3">RECENT TRANSMISSIONS</text>
<text x="42" y="88" fill="#f3eee4" font-size="29">Latest public code pushes</text>
<text x="1156" y="83" fill="#acb1ac" font-size="17" text-anchor="end">UTC</text>
<path d="M42 173H1158" stroke="#292b2c"/>
<circle class="activity-dot" cx="49" cy="140" r="4" fill="#4de0e6"/>
<text x="70" y="148" fill="#f3eee4" font-size="27">QueueLess-Pulse</text>
<text x="1156" y="148" fill="#acb1ac" font-size="21" text-anchor="end">2026-10-22</text><path d="M42 249H1158" stroke="#292b2c"/>
<circle class="activity-dot" cx="49" cy="216" r="4" fill="#4de0e6"/>
<text x="70" y="224" fill="#f3eee4" font-size="27">sacred-commerce</text>
<text x="1156" y="224" fill="#acb1ac" font-size="21" text-anchor="end">2026-10-21</text><path d="M42 325H1158" stroke="#292b2c"/>
<circle class="activity-dot" cx="49" cy="292" r="4" fill="#4de0e6"/>
<text x="70" y="300" fill="#f3eee4" font-size="27">Crown-Dental-Clinic</text>
<text x="1156" y="300" fill="#acb1ac" font-size="21" text-anchor="end">2026-10-14</text>
<text x="42" y="350" fill="#acb1ac" font-size="17">GitHub public repository data / checked 2026-10-30</text>
</g><path class="moving-rule" d="M0 2H1200" stroke="#67e8ee" stroke-width="3"/></svg>
