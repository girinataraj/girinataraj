<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-labelledby="title desc"><title id="title">LINKEDIN</title><desc id="desc">Original profile artwork for Giri Nataraj.</desc><defs><linearGradient id="edge"><stop stop-color="#50e5ed"/><stop offset=".55" stop-color="#4c8bef"/><stop offset="1" stop-color="#a89ddd"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#5dd8fa" stroke-opacity=".045"/></pattern><clipPath id="frame"><rect width="1200" height="220" rx="18"/></clipPath></defs><style>
@keyframes trace{to{stroke-dashoffset:-360}}
@keyframes breathe{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes sweep{0%{transform:translateX(-220px)}100%{transform:translateX(1400px)}}
@keyframes hue{0%,100%{fill:#12283e}50%{fill:#23435c}}
.trace{stroke-dasharray:100 260;animation:trace 5s linear infinite}
.pulse{animation:breathe 3s ease-in-out infinite}
.float{animation:float 4s ease-in-out infinite}
.sweep{animation:sweep 6s linear infinite}
@media(prefers-reduced-motion:reduce){.trace,.pulse,.float,.sweep{animation:none}}
</style><g clip-path="url(#frame)" font-family="Arial,Helvetica,sans-serif"><rect x="1" y="1" width="1198" height="218" rx="30" fill="#0e2031" stroke="#36617c" stroke-width="4"/><text x="98" y="145" font-size="92" fill="#62e8ee" font-weight="700">in</text><text x="330" y="137" font-size="70" fill="#e6f7ff" font-weight="700" letter-spacing="4">LINKEDIN</text></g><rect x="3" y="3" width="1194" height="214" rx="29" fill="none" stroke="#67e8ee" stroke-width="5" stroke-dasharray="150 2670"><animate attributeName="stroke-dashoffset" from="2820" to="0" dur="6s" repeatCount="indefinite"/></rect></svg>