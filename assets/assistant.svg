ill="none" stroke="#67e8ee" stroke-width="3"/><path class="sweep" d="M0 298H170" stroke="#66afff" stroke-width="2"/><circle class="pulse" cx="1174" cy="22" r="4" fill="#67e8ee"/><path d="M817 104H924V145H1042V104H1121" stroke="#a18dcf" fill="none" opacity=".3"/><circle r="5" fill="#ded2ff"><animateMotion path="M817 104H924V145H1042V104H1121" dur="3.2s" repeatCount="indefinite"/></circle><path d="M817 208H924V145H1042V208H1121" stroke="#a18dcf" fill="none" opacity=".3"/><circle r="5" fill="#ded2ff"><animateMotion path="M817 208H924V145H1042V208H1121" dur="3.9000000000000004s" repeatCount="indefinite"/></circle></svg>