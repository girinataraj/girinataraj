<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="255" viewBox="0 0 1200 255" role="img" aria-labelledby="title desc"><title id="title">Interfaces, backend systems, applied AI and product thinking</title><desc id="desc">Original profile artwork for Giri Nataraj.</desc><defs><linearGradient id="edge"><stop stop-color="#50e5ed"/><stop offset=".55" stop-color="#4c8bef"/><stop offset="1" stop-color="#a89ddd"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#5dd8fa" stroke-opacity=".045"/></pattern><clipPath id="frame"><rect width="1200" height="255" rx="18"/></clipPath></defs><g clip-path="url(#frame)" font-family="Arial,Helvetica,sans-serif"><rect width="1200" height="255" rx="18" fill="#08131f"/><rect x="8" y="8" width="284" height="239" rx="15" fill="#0f1d2c" stroke="#2b4158"/><text x="30" y="49" fill="#69e7ed" font-family="Consolas,monospace" font-size="19">/01</text><path d="M30 71H270" stroke="#69e7ed" stroke-opacity=".4"/><text x="30" y="112" font-size="20" font-weight="700" fill="#69e7ed">INTERFACES</text><text x="30" y="159" font-size="18" fill="#d5e3ef">Useful. Responsive. Human.</text><text x="30" y="209" font-size="16" fill="#97aec2">React / TypeScript / Next.js</text><rect x="308" y="8" width="284" height="239" rx="15" fill="#0f1d2c" stroke="#2b4158"/><text x="330" y="49" fill="#74adf5" font-family="Consolas,monospace" font-size="19">/02</text><path d="M330 71H570" stroke="#74adf5" stroke-opacity=".4"/><text x="330" y="112" font-size="20" font-weight="700" fill="#74adf5">BACKEND SYSTEMS</text><text x="330" y="159" font-size="18" fill="#d5e3ef">State. Access. Data flow.</text><text x="330" y="209" font-size="16" fill="#97aec2">Python / Node.js / C#</text><rect x="608" y="8" width="284" height="239" rx="15" fill="#0f1d2c" stroke="#2b4158"/><text x="630" y="49" fill="#b3a2ef" font-family="Consolas,monospace" font-size="19">/03</text><path d="M630 71H870" stroke="#b3a2ef" stroke-opacity=".4"/><text x="630" y="112" font-size="20" font-weight="700" fill="#b3a2ef">APPLIED AI</text><text x="630" y="159" font-size="18" fill="#d5e3ef">Retrieve. Route. Act.</text><text x="630" y="209" font-size="16" fill="#97aec2">RAG / vector search / MCP</text><rect x="908" y="8" width="284" height="239" rx="15" fill="#0f1d2c" stroke="#2b4158"/><text x="930" y="49" fill="#eab789" font-family="Consolas,monospace" font-size="19">/04</text><path d="M930 71H1170" stroke="#eab789" stroke-opacity=".4"/><text x="930" y="112" font-size="20" font-weight="700" fill="#eab789">PRODUCT THINKING</text><text x="930" y="159" font-size="18" fill="#d5e3ef">Scope. Test. Iterate.</text><text x="930" y="209" font-size="16" fill="#97aec2">Workflows / UX / trade-offs</text></g></svg>