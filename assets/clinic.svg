<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img"><title>Crown Dental Clinic: animated concept flow</title><rect width="1200" height="250" rx="18" fill="#0b1725"/><text x="35" y="43" fill="#a4c6dd" font-size="22" font-family="Consolas,monospace">CROWN DENTAL CLINIC / FLOW</text><rect x="35" y="80" width="350" height="110" rx="15" fill="#122638" stroke="#3c607b"/><text x="210" y="145" text-anchor="middle" fill="#67dfe7" font-size="31" font-family="Consolas,monospace">DISCOVER</text><rect x="425" y="80" width="350" height="110" rx="15" fill="#122638" stroke="#3c607b"/><text x="600" y="145" text-anchor="middle" fill="#67dfe7" font-size="31" font-family="Consolas,monospace">TREATMENTS</text><rect x="815" y="80" width="350" height="110" rx="15" fill="#122638" stroke="#3c607b"/><text x="990" y="145" text-anchor="middle" fill="#67dfe7" font-size="31" font-family="Consolas,monospace">CONTACT</text><path d="M35 221H1165" stroke="#294b66" stroke-width="3"/><circle r="7" fill="#67dfe7"><animateMotion path="M35 221H1165" dur="5s" repeatCount="indefinite"/></circle><rect x="35" y="80" width="350" height="110" rx="15" fill="none" stroke="#67dfe7" stroke-width="3" opacity=".3"><animate attributeName="x" values="35;425;815;35" calcMode="discrete" dur="6s" repeatCount="indefinite"/><animate attributeName="opacity" values=".2;1;.2" dur="2s" repeatCount="indefinite"/></rect></svg>