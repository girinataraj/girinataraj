<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc"><title id="title">QUEUELESS PULSE</title><desc id="desc">Original profile artwork for Giri Nataraj.</desc><defs><linearGradient id="edge"><stop stop-color="#50e5ed"/><stop offset=".55" stop-color="#4c8bef"/><stop offset="1" stop-color="#a89ddd"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#5dd8fa" stroke-opacity=".045"/></pattern><clipPath id="frame"><rect width="1200" height="300" rx="18"/></clipPath></defs><style>
@keyframes trace{to{stroke-dashoffset:-360}}
@keyframes breathe{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes sweep{0%{transform:translateX(-220px)}100%{transform:translateX(1400px)}}
@keyframes hue{0%,100%{fill:#12283e}50%{fill:#23435c}}
.trace{stroke-dasharray:100 260;animation:trace 5s linear infinite}
.pulse{animation:breathe 3s ease-in-out infinite}
.float{animation:float 4s ease-in-out infinite}
.sweep{animation:sweep 6s linear infinite}
@media(prefers-reduced-motion:reduce){.trace,.pulse,.float,.sweep{animation:none}}
</style><g clip-path="url(#frame)" font-family="Arial,Helvetica,sans-serif"><rect width="1200" height="300" fill="#0b1725"/><rect width="1200" height="300" fill="url(#grid)"/><path d="M0 0H1200" stroke="#64dfda" stroke-width="3"/><text x="36" y="45" font-size="18" letter-spacing="3" fill="#64dfda">BUILD / 01</text><text x="36" y="101" font-size="32" font-weight="700" fill="#e8f4ff">QUEUELESS PULSE</text><text x="36" y="166" font-size="42" font-weight="700" letter-spacing="-1" fill="#64dfda">A queue is a system.</text><text x="36" y="212" font-size="27" fill="#a9bfd2">Make every role work together.</text><path d="M36 256H682" stroke="#2b465c"/><text x="36" y="280" font-size="15" font-family="Consolas,monospace" fill="#8faac1">CASE STUDY / INTERFACE + ENGINEERING</text><rect x="756" y="70" width="114" height="151" rx="12" fill="#102b35" stroke="#376877"/><text x="813" y="100" text-anchor="middle" fill="#9ac5cf" font-size="13" letter-spacing="1">SERVING</text><text x="813" y="164" text-anchor="middle" fill="#d5fcff" font-size="41" font-weight="700">024</text><path d="M774 187H852" stroke="#376877"/><rect x="888" y="84" width="114" height="151" rx="12" fill="#102b35" stroke="#376877"/><text x="945" y="114" text-anchor="middle" fill="#9ac5cf" font-size="13" letter-spacing="1">UP NEXT</text><text x="945" y="178" text-anchor="middle" fill="#d5fcff" font-size="41" font-weight="700">025</text><path d="M906 201H984" stroke="#376877"/><rect x="1020" y="98" width="114" height="151" rx="12" fill="#102b35" stroke="#376877"/><text x="1077" y="128" text-anchor="middle" fill="#9ac5cf" font-size="13" letter-spacing="1">WAITING</text><text x="1077" y="192" text-anchor="middle" fill="#d5fcff" font-size="41" font-weight="700">026</text><path d="M1038 215H1116" stroke="#376877"/></g><path class="trace" d="M20 2H1180" fill="none" stroke="#67e8ee" stroke-width="3"/><path class="sweep" d="M0 298H170" stroke="#66afff" stroke-width="2"/><circle class="pulse" cx="1174" cy="22" r="4" fill="#67e8ee"/><rect x="751" y="65" width="124" height="161" rx="16" fill="none" stroke="#6ee8e1" stroke-width="3" opacity="0"><animate attributeName="opacity" values="0;1;0" dur="4.5s" begin="0s" repeatCount="indefinite"/></rect><rect x="883" y="79" width="124" height="161" rx="16" fill="none" stroke="#6ee8e1" stroke-width="3" opacity="0"><animate attributeName="opacity" values="0;1;0" dur="4.5s" begin="1.5s" repeatCount="indefinite"/></rect><rect x="1015" y="93" width="124" height="161" rx="16" fill="none" stroke="#6ee8e1" stroke-width="3" opacity="0"><animate attributeName="opacity" values="0;1;0" dur="4.5s" begin="3s" repeatCount="indefinite"/></rect><path d="M748 253H1156" stroke="#446e83" stroke-width="2"/><circle r="5" fill="#80ffff"><animateMotion path="M748 253H1156" dur="3s" repeatCount="indefinite"/></circle></svg>