<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-labelledby="title desc"><title id="title">Have a problem worth solving? Let us build it.</title><desc id="desc">Original profile artwork for Giri Nataraj.</desc><defs><linearGradient id="edge"><stop stop-color="#50e5ed"/><stop offset=".55" stop-color="#4c8bef"/><stop offset="1" stop-color="#a89ddd"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#5dd8fa" stroke-opacity=".045"/></pattern><clipPath id="frame"><rect width="1200" height="220" rx="18"/></clipPath></defs><style>
@keyframes trace{to{stroke-dashoffset:-360}}
@keyframes breathe{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes sweep{0%{transform:translateX(-220px)}100%{transform:translateX(1400px)}}
@keyframes hue{0%,100%{fill:#12283e}50%{fill:#23435c}}
.trace{stroke-dasharray:100 260;animation:trace 5s linear infinite}
.pulse{animation:breathe 3s ease-in-out infinite}
.float{animation:float 4s ease-in-out infinite}
.sweep{animation:sweep 6s linear infinite}
@media(prefers-reduced-motion:reduce){.trace,.pulse,.float,.sweep{animation:none}}
</style><g clip-path="url(#frame)" font-family="Arial,Helvetica,sans-serif">
<rect width="1200" height="220" rx="18" fill="#0c1a2b" stroke="#35516b"/>
<rect width="1200" height="220" fill="url(#grid)"/>
<path d="M38 40H48M43 35V45M1152 180H1162M1157 175V185" stroke="#63e7ed"/>
<text x="600" y="65" text-anchor="middle" fill="#7fe8ed" font-family="Consolas,monospace" font-size="18" letter-spacing="4">NEXT UP / YOUR IDEA</text>
<text x="600" y="128" text-anchor="middle" fill="#e7f4ff" font-weight="700" font-size="43">Have a problem worth solving?</text>
<text x="600" y="178" text-anchor="middle" fill="#9ab8d4" font-size="25">Let’s turn it into something people can use.</text></g><path class="trace" d="M20 2H1180" fill="none" stroke="#67e8ee" stroke-width="3"/><path class="sweep" d="M0 218H170" stroke="#66afff" stroke-width="2"/><circle class="pulse" cx="1174" cy="22" r="4" fill="#67e8ee"/><path d="M80 190H1120" stroke="#67e8ee" stroke-width="2" stroke-dasharray="120 920"><animate attributeName="stroke-dashoffset" from="1040" to="0" dur="5s" repeatCount="indefinite"/></path><rect x="1030" y="109" width="10" height="26" fill="#67e8ee"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.45;.5;1" dur="1.4s" repeatCount="indefinite"/></rect></svg>