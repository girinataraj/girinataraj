<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" role="img" aria-labelledby="title desc">
<title id="title">Giri Nataraj / From interface to infrastructure</title><desc id="desc">Full-stack development, applied AI, product thinking. Original animated engineering diagram. Motion finishes after eight seconds.</desc>
