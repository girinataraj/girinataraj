<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc"><title id="title">SACRED COMMERCE</title><desc id="desc">Original profile artwork for Giri Nataraj.</desc><defs><linearGradient id="edge"><stop stop-color="#50e5ed"/><stop offset=".55" stop-color="#4c8bef"/><stop offset="1" stop-color="#a89ddd"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#5dd8fa" stroke-opacity=".045"/></pattern><clipPath id="frame"><rect width="1200" height="300" rx="18"/></clipPath></defs><style>
@keyframes trace{to{stroke-dashoffset:-360}}
@keyframes breathe{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes sweep{0%{transform:translateX(-220px)}100%{transform:translateX(1400px)}}
@keyframes hue{0%,100%{fill:#12283e}50%{fill:#23435c}}
.trace{stroke-dasharray:100 260;animation:trace 5s linear infinite}
.pulse{animation:breathe 3s ease-in-out infinite}
.float{animation:float 4s ease-in-out infinite}
.sweep{animation:sweep 6s linear infinite}
@media(prefers-reduced-motion:reduce){.trace,.pulse,.float,.sweep{animation:none}}
</style><g clip-path="url(#frame)" font-family="Arial,Helvetica,sans-serif"><rect width="1200" height="300" fill="#0b1725"/><rect width="1200" height="300" fill="url(#grid)"/><path d="M0 0H1200" stroke="#e7b989" stroke-width="3"/><text x="36" y="45" font-size="18" letter-spacing="3" fill="#e7b989">BUILD / 03</text><text x="36" y="101" font-size="32" font-weight="700" fill="#e8f4ff">SACRED COMMERCE</text><text x="36" y="166" font-size="42" font-weight="700" letter-spacing="-1" fill="#e7b989">Designed to be explored.</text><text x="36" y="212" font-size="27" fill="#a9bfd2">Built around product decisions.</text><path d="M36 256H682" stroke="#2b465c"/><text x="36" y="280" font-size="15" font-family="Consolas,monospace" fill="#8faac1">CASE STUDY / INTERFACE + ENGINEERING</text><path d="M837 284V129A122 122 0 0 1 1081 129V284" fill="#493d36"/><path d="M866 284V131A93 93 0 0 1 1052 131V284" fill="#897159"/><path d="M944 205H975L995 268Q960 284 924 268Z" fill="#c58964"/><path d="M960 205Q944 155 975 97M958 172Q1007 145 1016 122M958 160Q923 150 907 111" fill="none" stroke="#b9c0a1" stroke-width="3"/><path d="M972 111Q944 77 981 61Q1000 91 972 111M986 157Q989 121 1022 111Q1017 150 986 157M937 153Q904 149 894 112Q932 116 937 153" fill="#a5b58c"/></g><path class="trace" d="M20 2H1180" fill="none" stroke="#67e8ee" stroke-width="3"/><path class="sweep" d="M0 298H170" stroke="#66afff" stroke-width="2"/><circle class="pulse" cx="1174" cy="22" r="4" fill="#67e8ee"/><path d="M837 284V129A122 122 0 0 1 1081 129V284" fill="#51688c" opacity="0"><animate attributeName="opacity" values="0;.65;0" dur="7s" repeatCount="indefinite"/></path><g fill="#edc997"><circle cx="1112" cy="69" r="12"><animate attributeName="cy" values="69;52;69" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values=".3;1;.3" dur="7s" repeatCount="indefinite"/></circle><path d="M773 264H1145" stroke="#eccca3" stroke-width="2" stroke-dasharray="70 302"><animate attributeName="stroke-dashoffset" from="372" to="0" dur="5s" repeatCount="indefinite"/></path></g></svg>